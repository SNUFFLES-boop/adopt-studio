plugins {
    id 'com.android.application'
}

android {
    namespace 'com.deltro.avatarswitcher'
    compileSdk 34

    defaultConfig {
        applicationId 'com.deltro.avatarswitcher'
        minSdk 24
        targetSdk 34
        versionCode 4
        versionName '1.1.2'
    }

    signingConfigs {
        // Release builds are signed with a key from the build's secrets when present,
        // otherwise with the debug key so the APK still installs.
        release {
            def ks = System.getenv('SIGNING_KEYSTORE')
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv('SIGNING_STORE_PASSWORD')
                keyAlias System.getenv('SIGNING_KEY_ALIAS')
                keyPassword System.getenv('SIGNING_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig System.getenv('SIGNING_KEYSTORE') ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
